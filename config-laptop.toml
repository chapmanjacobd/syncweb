# Battery- and mobile-network-friendly defaults.
[bandwidth]
max_upload = "500KB/s"
max_download = "2MB/s"

[schedule]
active_hours = "08:00-22:00"

[[schedule.bandwidth]]
hours = "08:00-18:00"
max_upload = "250KB/s"
max_download = "1MB/s"

[parallel]
threads = 2

# Peer availability tracker entry limit (not a blob data cache).
[cache]
max_cache_size = 5000

# Iroh blob data cache size in GiB.
[advanced]
blob_cache_size_gb = 2
