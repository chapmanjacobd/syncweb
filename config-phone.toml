# Storage- and battery-constrained defaults.
[transfer_limits]
max_upload_per_day = "250M"
max_download_per_day = "1G"

[parallel]
threads = 1

# Peer availability tracker entry limit (not a blob data cache).
[cache]
max_cache_size = 1000

# Iroh blob data cache size in GiB.
[advanced]
blob_cache_size_gb = 2
