# Throughput- and availability-oriented defaults.
[bandwidth]
max_upload = "0"
max_download = "0"

[schedule]
active_hours = ""

[parallel]
threads = 0

# Peer availability tracker entry limit (not a blob data cache).
[cache]
max_cache_size = 50000

# Iroh blob data cache size in GiB.
[advanced]
blob_cache_size_gb = 10
