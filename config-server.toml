# Throughput- and availability-oriented defaults.
[schedule]
active_hours = ""

# No transfer quotas: omit [transfer_limits], or set keys to "0" for unlimited.
[transfer_limits]
max_upload_per_month = "0"
max_download_per_month = "0"

[parallel]
threads = 0

# Peer availability tracker entry limit (not a blob data cache).
[cache]
max_cache_size = 50000

# Iroh blob data cache size in GiB.
[advanced]
blob_cache_size_gb = 10
